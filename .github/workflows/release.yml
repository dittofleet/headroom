name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: make test
      - run: make zip VERSION="${GITHUB_REF_NAME}" ARCHS="--arch arm64 --arch x86_64"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/Headroom.zip
